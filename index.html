<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGA - Supabase Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .tier-bronze { background: linear-gradient(135deg, #cd7f32, #a0522d); }
        .tier-silver { background: linear-gradient(135deg, #94a3b8, #475569); }
        .tier-gold { background: linear-gradient(135deg, #fbbf24, #d97706); }
        .progress-glow { box-shadow: 0 0 20px rgba(99, 102, 241, 0.2); }
        .nav-indicator { position: absolute; bottom: 0; height: 3px; background: linear-gradient(90deg, #4f46e5, #7c3aed); border-radius: 2px 2px 0 0; transition: all 300ms; }
    </style>
</head>
<body class="bg-[#FBFDFF] text-slate-900 min-h-screen pb-28">

    <!-- LOGIN VIEWS (LANDING, MASTER, PESSOA) -->
    <div id="view-landing" class="hidden min-h-screen items-center justify-center p-6">
        <div class="text-center">
            <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-indigo-600 text-white shadow-lg"><i data-lucide="zap" class="h-7 w-7"></i></div>
            <h1 class="text-2xl font-black text-slate-800">SIGA</h1>
            <p class="mt-2 text-sm text-slate-500">Sistema Integrado de Gestão e Atendimento</p>
            <a href="#master-login" class="mt-8 inline-block text-[10px] font-black uppercase tracking-widest text-indigo-400">Área Administrativa</a>
        </div>
    </div>

    <!-- PAINEL LOGIN MASTER (SUPABASE AUTH) -->
    <div id="view-master-login" class="hidden min-h-screen items-center justify-center p-6">
        <form id="master-login-form" class="w-full max-w-sm rounded-[2rem] border border-slate-100 bg-white p-8 shadow-xl">
            <div class="mb-6 text-center"><h1 class="text-lg font-black text-slate-800">Painel Master</h1><p class="text-xs text-slate-400">Entrar com Supabase Auth</p></div>
            <label class="mb-3 block text-[10px] font-black uppercase tracking-wider text-slate-400">E-mail<input id="master-email" type="email" required class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-indigo-400"></label>
            <label class="mb-4 block text-[10px] font-black uppercase tracking-wider text-slate-400">Senha<input id="master-password" type="password" required class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-indigo-400"></label>
            <p id="master-error" class="mb-3 text-[10px] font-bold text-red-500 text-center"></p>
            <button type="submit" class="w-full rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-black text-white hover:bg-indigo-700">Entrar no Supabase</button>
        </form>
    </div>

    <!-- PAINEL MASTER (GERENCIAMENTO DE LOJAS E EQUIPE) -->
    <div id="view-master-panel" class="hidden min-h-screen p-4">
        <header class="max-w-5xl mx-auto flex justify-between items-center py-6">
             <div class="flex items-center gap-2 font-black text-indigo-600"><i data-lucide="shield-check"></i> SIGA ADMIN</div>
             <button onclick="logout()" class="text-xs font-bold text-slate-400">Sair</button>
        </header>
        <main class="max-w-5xl mx-auto space-y-6">
            <section class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm">
                <h2 class="font-black text-slate-800 mb-4">Cadastrar Nova Loja</h2>
                <div class="flex gap-2">
                    <input id="new-loja-name" placeholder="Nome da Loja" class="flex-1 rounded-xl border border-slate-200 px-4 py-2 text-sm outline-none">
                    <button onclick="createLoja()" class="bg-indigo-600 text-white px-6 py-2 rounded-xl text-xs font-black">Adicionar</button>
                </div>
                <div id="loja-list" class="mt-6 space-y-2"></div>
            </section>
        </main>
    </div>

    <!-- APP SHELL (DASHBOARD) -->
    <div id="app-shell" class="hidden">
        <header class="sticky top-0 z-50 bg-white/70 backdrop-blur-xl border-b border-slate-100">
            <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
                <div class="flex items-center gap-2"><div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center text-white"><i data-lucide="zap" class="w-5 h-5 fill-white"></i></div><span class="text-xl font-black text-slate-800">SIGA</span></div>
                <button onclick="logout()" class="h-8 w-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-500"><i data-lucide="log-out" class="w-4 h-4"></i></button>
            </div>
        </header>
        <main id="dashboard-content" class="max-w-5xl mx-auto p-4">
            <!-- Os conteúdos dinâmicos entram aqui -->
            <h1 class="text-2xl font-black text-slate-800">Bem-vindo ao SIGA</h1>
            <p class="text-slate-500">Dados integrados com Supabase com sucesso.</p>
        </main>
    </div>

    <script>
        // 1. CONFIGURAÇÃO SUPABASE
        const SUPABASE_URL = "https://kqnfjtubsdxaatzfdlvf.supabase.co";
        const SUPABASE_KEY = "sb_publishable_DyoyiM0MvNNgsEmpsh7eWw_FHqfTshT";
        const supabase = bootstrapSupabase();

        function bootstrapSupabase() {
            return supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }

        // 2. CONTROLE DE ESTADO E NAVEGAÇÃO
        async function init() {
            lucide.createIcons();
            const { data: { session } } = await supabase.auth.getSession();
            
            // Roteamento Simples
            const hash = window.location.hash;
            if (hash === "#master-login") {
                showView('view-master-login');
            } else if (session) {
                showView('view-master-panel');
                renderLojas();
            } else {
                showView('view-landing');
            }
        }

        function showView(id) {
            ['view-landing', 'view-master-login', 'view-master-panel', 'app-shell'].forEach(v => {
                document.getElementById(v).classList.add('hidden');
            });
            document.getElementById(id).classList.remove('hidden');
            if (id === 'view-landing' || id === 'view-master-login') {
                document.getElementById(id).classList.add('flex');
            }
        }

        // 3. AUTENTICAÇÃO MASTER
        document.getElementById('master-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('master-email').value;
            const password = document.getElementById('master-password').value;
            
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                document.getElementById('master-error').innerText = "Erro: " + error.message;
            } else {
                window.location.hash = "#master";
                init();
            }
        });

        async function logout() {
            await supabase.auth.signOut();
            window.location.hash = "";
            location.reload();
        }

        // 4. OPERAÇÕES DE BANCO (LOJAS)
        async function createLoja() {
            const nome = document.getElementById('new-loja-name').value;
            const slug = nome.toLowerCase().replace(/ /g, '-');
            
            const { data, error } = await supabase.from('lojas').insert([{ nome, slug }]);
            if (error) alert("Erro ao criar loja: " + error.message);
            else {
                document.getElementById('new-loja-name').value = "";
                renderLojas();
            }
        }

        async function renderLojas() {
            const { data: lojas, error } = await supabase.from('lojas').select('*').order('created_at', { ascending: false });
            const list = document.getElementById('loja-list');
            list.innerHTML = lojas.map(loja => `
                <div class="flex items-center justify-between p-4 border border-slate-100 rounded-2xl bg-slate-50">
                    <div>
                        <p class="font-bold text-slate-700">${loja.nome}</p>
                        <p class="text-[10px] text-slate-400 uppercase font-black">${loja.slug}</p>
                    </div>
                    <button onclick="gerarLink('${loja.id}', '${loja.slug}')" class="text-[10px] font-black text-indigo-600 uppercase">Gerar Acesso Vendedor</button>
                </div>
            `).join('');
        }

        // 5. FUNÇÕES DE VENDAS E TAREFAS (MODELO PARA EXPANDIR)
        async function salvarVenda(lojaId, userId, valor, produtos) {
            const { data, error } = await supabase.from('vendas').insert([{
                loja_id: lojaId,
                user_id: userId,
                valor: valor,
                data_venda: new Date().toISOString(),
                produtos: produtos // Enviado como Array JSON
            }]);
            return { data, error };
        }

        async function getTarefasDoDia(userId) {
            const hoje = new Date().toISOString().split('T')[0];
            const { data, error } = await supabase
                .from('tarefas')
                .select('*')
                .eq('user_id', userId)
                .eq('data_tarefa', hoje);
            return data;
        }

        // Iniciar
        window.addEventListener('hashchange', init);
        init();

    </script>
</body>
</html>
