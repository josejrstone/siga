<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGA - Supabase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .hidden { display: none !important; }
        .flex-view { display: flex !important; }
    </style>
</head>
<body class="bg-[#FBFDFF] text-slate-900 min-h-screen">

    <!-- 1. VIEW: CARREGANDO (Evita tela branca vazia) -->
    <div id="view-loading" class="min-h-screen flex items-center justify-center bg-white">
        <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-indigo-600"></div>
    </div>

    <!-- 2. VIEW: LANDING -->
    <div id="view-landing" class="hidden min-h-screen items-center justify-center p-6">
        <div class="text-center">
            <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-indigo-600 text-white shadow-lg">
                <i data-lucide="zap" class="h-7 w-7"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-800">SIGA</h1>
            <p class="mt-2 text-sm text-slate-500">Sistema de Gestão Integrado</p>
            <a href="#master-login" class="mt-10 inline-block text-[10px] font-black uppercase tracking-widest text-indigo-400">Painel Administrativo</a>
        </div>
    </div>

    <!-- 3. VIEW: LOGIN MASTER -->
    <div id="view-master-login" class="hidden min-h-screen items-center justify-center p-6">
        <form id="master-login-form" class="w-full max-w-sm rounded-[2rem] border border-slate-100 bg-white p-8 shadow-xl">
            <div class="mb-6 text-center">
                <h1 class="text-lg font-black text-slate-800">Painel Master</h1>
                <p class="text-xs text-slate-400">Acesso via Supabase Auth</p>
            </div>
            <div class="space-y-4">
                <label class="block text-[10px] font-black uppercase tracking-wider text-slate-400">E-mail
                    <input id="master-email" type="email" required class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-indigo-400">
                </label>
                <label class="block text-[10px] font-black uppercase tracking-wider text-slate-400">Senha
                    <input id="master-password" type="password" required class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-indigo-400">
                </label>
            </div>
            <p id="master-error" class="mt-4 text-[10px] font-bold text-red-500 text-center min-h-[15px]"></p>
            <button type="submit" class="mt-4 w-full rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-black text-white hover:bg-indigo-700 transition-all">Entrar</button>
            <button type="button" onclick="window.location.hash=''" class="mt-2 w-full text-[10px] font-bold text-slate-400 uppercase">Voltar</button>
        </form>
    </div>

    <!-- 4. VIEW: PAINEL MASTER (Pós-Login) -->
    <div id="view-master-panel" class="hidden min-h-screen bg-[#FBFDFF] p-4">
        <header class="max-w-5xl mx-auto flex justify-between items-center py-6">
            <div class="flex items-center gap-2 font-black text-indigo-600">
                <i data-lucide="shield-check"></i> SIGA ADMIN
            </div>
            <button onclick="handleLogout()" class="text-xs font-bold text-slate-400 hover:text-red-500">Sair da Conta</button>
        </header>
        
        <main class="max-w-5xl mx-auto space-y-6">
            <!-- Cadastro de Loja -->
            <section class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm">
                <h2 class="font-black text-slate-800 mb-4 flex items-center gap-2">
                    <i data-lucide="plus-circle" class="w-5 h-5 text-indigo-600"></i> Cadastrar Nova Loja
                </h2>
                <div class="flex flex-col sm:flex-row gap-2">
                    <input id="new-loja-name" type="text" placeholder="Ex: Loja Centro" class="flex-1 rounded-xl border border-slate-200 px-4 py-2.5 text-sm outline-none focus:border-indigo-400">
                    <button onclick="handleCreateLoja()" class="bg-indigo-600 text-white px-6 py-2.5 rounded-xl text-xs font-black hover:bg-indigo-700 shadow-lg shadow-indigo-100">Criar Loja</button>
                </div>
            </section>

            <!-- Lista de Lojas -->
            <section class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm">
                <h2 class="font-black text-slate-800 mb-4">Lojas Ativas</h2>
                <div id="loja-list" class="space-y-3">
                    <!-- Gerado via JS -->
                </div>
            </section>
        </main>
    </div>

    <script>
        // --- 1. CONFIGURAÇÃO ---
        const SB_URL = "https://kqnfjtubsdxaatzfdlvf.supabase.co";
        const SB_KEY = "sb_publishable_DyoyiM0MvNNgsEmpsh7eWw_FHqfTshT";
        
        // Inicialização correta do cliente para evitar erro de tela branca
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        // --- 2. NAVEGAÇÃO ---
        async function router() {
            try {
                const hash = window.location.hash;
                const { data: { session } } = await supabaseClient.auth.getSession();

                // Reset de visualização
                hideAll();

                if (hash === "#master-login") {
                    if (session) { window.location.hash = "#master"; return; }
                    showView('view-master-login', 'flex');
                } 
                else if (hash === "#master") {
                    if (!session) { window.location.hash = "#master-login"; return; }
                    showView('view-master-panel', 'block');
                    renderLojas();
                } 
                else {
                    showView('view-landing', 'flex');
                }

                lucide.createIcons();
            } catch (err) {
                console.error("Erro no Router:", err);
                // Em caso de erro crítico, volta para o início
                document.getElementById('view-loading').innerHTML = `<p class="text-red-500 font-bold">Erro de conexão: ${err.message}</p>`;
            }
        }

        function hideAll() {
            ['view-loading', 'view-landing', 'view-master-login', 'view-master-panel'].forEach(id => {
                const el = document.getElementById(id);
                if(el) el.classList.add('hidden');
            });
        }

        function showView(id, display) {
            const el = document.getElementById(id);
            if(el) {
                el.classList.remove('hidden');
                if(display === 'flex') el.classList.add('flex');
            }
        }

        // --- 3. AUTENTICAÇÃO ---
        document.getElementById('master-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const email = document.getElementById('master-email').value;
            const password = document.getElementById('master-password').value;
            const errorEl = document.getElementById('master-error');

            btn.innerText = "Autenticando...";
            btn.disabled = true;
            errorEl.innerText = "";

            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                errorEl.innerText = "Falha: " + error.message;
                btn.innerText = "Entrar";
                btn.disabled = false;
            } else {
                window.location.hash = "#master";
            }
        });

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            window.location.hash = "";
            window.location.reload();
        }

        // --- 4. GESTÃO DE LOJAS ---
        async function handleCreateLoja() {
            const input = document.getElementById('new-loja-name');
            const nome = input.value.trim();
            if (!nome) return;

            const slug = nome.toLowerCase()
                .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // remove acentos
                .replace(/[^a-z0-9]/g, '-');

            const { error } = await supabaseClient.from('lojas').insert([{ nome, slug }]);

            if (error) {
                alert("Erro ao criar: " + error.message);
            } else {
                input.value = "";
                renderLojas();
            }
        }

        async function renderLojas() {
            const list = document.getElementById('loja-list');
            list.innerHTML = `<div class="p-4 text-center text-slate-400 text-xs">Carregando lojas...</div>`;

            const { data: lojas, error } = await supabaseClient
                .from('lojas')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                list.innerHTML = `<p class="text-red-500 text-xs">Erro ao carregar lojas.</p>`;
                return;
            }

            if (lojas.length === 0) {
                list.innerHTML = `<div class="p-8 text-center border-2 border-dashed border-slate-100 rounded-2xl text-slate-400 text-sm">Nenhuma loja cadastrada ainda.</div>`;
                return;
            }

            list.innerHTML = lojas.map(loja => `
                <div class="flex items-center justify-between p-4 border border-slate-100 rounded-2xl bg-slate-50 hover:border-indigo-200 transition-colors">
                    <div>
                        <p class="font-bold text-slate-700">${loja.nome}</p>
                        <p class="text-[9px] text-slate-400 uppercase font-black tracking-widest">${loja.slug}</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="copyAccessLink('${loja.slug}')" class="bg-white border border-slate-200 text-indigo-600 px-3 py-1.5 rounded-lg text-[10px] font-black uppercase hover:bg-indigo-50">Copiar Link</button>
                    </div>
                </div>
            `).join('');
        }

        function copyAccessLink(slug) {
            const url = `${window.location.origin}${window.location.pathname}#loja/${slug}`;
            navigator.clipboard.writeText(url).then(() => {
                alert("Link da loja copiado!");
            });
        }

        // --- 5. INICIALIZAÇÃO ---
        window.addEventListener('hashchange', router);
        window.addEventListener('load', router);
        
        // Executa o router imediatamente na primeira carga
        router();

    </script>
</body>
</html>
